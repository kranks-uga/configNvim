# Глобальный конфиг asm-lsp: NASM, x86-64.
# Для проекта на GAS положи в корень проекта свой .asm-lsp.toml с assembler = "gas".
[default_config]
version = "0.10.1"
assembler = "nasm"
instruction_set = "x86-64"

[default_config.opts]
compiler = "nasm"
compile_flags_txt = ["-f", "elf64", "-o", "/dev/null"]
diagnostics = true
default_diagnostics = true
